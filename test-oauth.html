<!DOCTYPE html>
<html>
<head>
    <title>OAuth Test</title>
</head>
<body>
    <h1>OAuth Test</h1>
    <button onclick="testOAuth()">Test OAuth</button>
    <div id="result"></div>

    <script>
        async function testOAuth() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing OAuth...';
            
            try {
                // Generate PKCE parameters
                const verifier = generateCodeVerifier();
                const challenge = await generateCodeChallenge(verifier);
                
                // Store verifier
                sessionStorage.setItem('pkce_code_verifier', verifier);
                
                // Build auth URL
                const authUrl = `https://localhost:8443/realms/reports-realm/protocol/openid-connect/auth?` +
                    `client_id=reports-frontend&` +
                    `redirect_uri=https://localhost/&` +
                    `response_type=code&` +
                    `scope=openid profile email&` +
                    `code_challenge=${challenge}&` +
                    `code_challenge_method=S256&` +
                    `state=test123`;
                
                resultDiv.innerHTML = `Auth URL: ${authUrl}<br><br>Verifier: ${verifier}<br><br>Challenge: ${challenge}`;
                
                // Redirect to auth
                window.location.href = authUrl;
                
            } catch (error) {
                resultDiv.innerHTML = `Error: ${error.message}`;
            }
        }
        
        function generateCodeVerifier() {
            const array = new Uint8Array(32);
            crypto.getRandomValues(array);
            return base64URLEncode(array);
        }
        
        async function generateCodeChallenge(verifier) {
            const encoder = new TextEncoder();
            const data = encoder.encode(verifier);
            const digest = await crypto.subtle.digest('SHA-256', data);
            return base64URLEncode(new Uint8Array(digest));
        }
        
        function base64URLEncode(array) {
            const binaryString = Array.from(array, byte => String.fromCharCode(byte)).join('');
            return btoa(binaryString)
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=/g, '');
        }
        
        // Check if we have a code in the URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        
        if (code) {
            document.getElementById('result').innerHTML = `Code received: ${code}<br><br>Testing token exchange...`;
            testTokenExchange(code);
        }
        
        async function testTokenExchange(code) {
            try {
                const verifier = sessionStorage.getItem('pkce_code_verifier');
                if (!verifier) {
                    throw new Error('No verifier found');
                }
                
                const response = await fetch('https://localhost:8443/realms/reports-realm/protocol/openid-connect/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        grant_type: 'authorization_code',
                        client_id: 'reports-frontend',
                        client_secret: 'C60JxJONZAvMyoHHjVg84UbAwy4foEyr',
                        code: code,
                        redirect_uri: 'https://localhost/',
                        code_verifier: verifier
                    })
                });
                
                const result = await response.json();
                document.getElementById('result').innerHTML = `Token exchange result: ${JSON.stringify(result, null, 2)}`;
                
            } catch (error) {
                document.getElementById('result').innerHTML = `Token exchange error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
