[core]
# Директория для DAG'ов
dags_folder = /opt/airflow/dags

# Директория для плагинов
plugins_folder = /opt/airflow/plugins

# Директория для логов
base_log_folder = /opt/airflow/logs

# Исполнитель
executor = LocalExecutor

# База данных для метаданных Airflow
sql_alchemy_conn = postgresql://airflow:airflow@airflow_db:5432/airflow

# Настройки безопасности
secret_key = bionicpro_airflow_secret_key_2025

# Настройки расписания
default_timezone = Europe/Moscow

# Настройки параллелизма
parallelism = 32
dag_concurrency = 16
max_active_runs_per_dag = 16

# Настройки веб-интерфейса
web_server_port = 8080
web_server_host = 0.0.0.0

# Настройки email (если нужны уведомления)
smtp_host = localhost
smtp_starttls = True
smtp_ssl = False
smtp_user = 
smtp_password = 
smtp_mail_from = airflow@bionicpro.com

[logging]
# Уровень логирования
logging_level = INFO

# Формат логов
log_format = [%%(asctime)s] {%%(filename)s:%%(lineno)d} %%(levelname)s - %%(message)s
simple_log_format = %%(asctime)s %%(levelname)s - %%(message)s

[webserver]
# Настройки веб-сервера
base_url = http://localhost:8080
web_server_host = 0.0.0.0
web_server_port = 8080

# Аутентификация
authenticate = False
auth_backend = airflow.contrib.auth.backends.password_auth

# Настройки сессий
session_lifetime_days = 30
session_lifetime_minutes = 30

[scheduler]
# Настройки планировщика
job_heartbeat_sec = 5
scheduler_heartbeat_sec = 5
run_duration = -1
num_runs = -1

# Настройки задач
task_runner = StandardTaskRunner
task_instance_trigger_retry_delay = 1.0

[celery]
# Настройки Celery (если используется)
broker_url = redis://redis:6379/0
result_backend = redis://redis:6379/0

[operators]
# Настройки операторов
default_owner = bionicpro-team
default_cpus = 1
default_ram = 512
default_disk = 512
default_gpus = 0

[admin]
# Настройки администратора
ui_color = #fff
